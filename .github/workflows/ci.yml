name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le workflow ne fait que lire le dépôt et exécuter les tests.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # npm test compile TypeScript, copie les grammaires WASM dans out/,
      # puis lance la suite node:test sur le code compilé.
      - name: Tests
        run: npm test
